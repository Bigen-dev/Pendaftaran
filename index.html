<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Pendaftaran Flexibel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pembungkus Utama (Memisahkan Gambar & Form) -->
  <div class="wrapper">
    
    <!-- Bagian 1: Gambar Terpisah -->
    <div class="image-section">
      <img src="../IMG/NIKA.PNG" alt="Ilustrasi">
    </div>

    <!-- Bagian 2: Kartu Formulir -->
    <div class="form-section">
      <h2>Formulir Pendaftaran</h2>

      <form id="formPendaftaran">
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" placeholder="Masukkan nama lengkap Anda" required>
        </div>

        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
          <label for="alasan">Motivasi Bergabung</label>
          <textarea id="alasan" rows="4" placeholder="Tuliskan alasan Anda..." required></textarea>
        </div>

        <button type="submit" id="btnKirim">Kirim Pendaftaran</button>
      </form>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
